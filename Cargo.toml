[package]
name = "citycam"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.41"
dirs = "6.0.0"
image = "0.25.6"
m3u8-rs = "6.0.0"
rand = "0.9.2"
rand_distr = "0.5.1"
regex = "1.11.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
imageproc = "0.23.0"
tempfile = "3.20.0"
ffmpeg-next = "7.1.0"
wallpaper = "3"
clap = { version = "4.5.45", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
iced = { version = "0.13.1", features = ["image"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Slower build, smaller size
panic = "abort"     # Remove panic unwinding
strip = true        # Strip symbols
